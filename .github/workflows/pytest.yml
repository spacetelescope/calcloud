name: pytest

on: [push, pull_request]

jobs:
  coverage:
    name: code coverage check
    runs-on: ubuntu-22.04

    steps:
      - name: set up python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: checkout code
        uses: actions/checkout@v2

      - name: install requirements
        run: |
          pip install .[dev]
          pip install     numpy==2.2.6 scipy==1.16.3 pandas==3.0.5 scikit-learn==1.7.2 --upgrade-strategy only-if-needed

      - name: run pytest code coverage check
        run: |
          pytest \
            --verbose \
            --cov=calcloud \
            --cov=lambda/AmiRotation \
            --cov=lambda/batch_events \
            --cov=lambda/blackboard \
            --cov=lambda/broadcast \
            --cov=lambda/JobClean \
            --cov=lambda/JobDelete \
            --cov=lambda/JobPredict \
            --cov=lambda/JobRescue \
            --cov=lambda/ModelIngest \
            --cov=lambda/s3_trigger \
            --cov-fail-under 30 \

  pytest:
    name: pytest
    runs-on: ubuntu-22.04

    steps:
      - name: set up python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: checkout code
        uses: actions/checkout@v2

      - name: install requirements
        run: |
          pip install .[dev]
          pip install numpy==2.2.6 scipy==1.16.3 pandas==3.0.5 scikit-learn==1.7.2

      - name: run pytest
        run: pytest -rP