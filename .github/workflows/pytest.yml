name: pytest

on: [push, pull_request]

jobs:
  coverage:
    name: code coverage check
    runs-on: ubuntu-22.04

    steps:
      - name: set up python 3.13
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: checkout code
        uses: actions/checkout@v2

      - name: install requirements
        run: |
          pip install .[dev]
          pip install -r lambda/JobPredict/requirements.txt --upgrade-strategy only-if-needed

      - name: run pytest code coverage check
        run: |
          # Match docker flag
          export JOBLIB_MULTIPROCESSING=0
          pytest \
            --verbose \
            --cov=calcloud \
            --cov=lambda/AmiRotation \
            --cov=lambda/batch_events \
            --cov=lambda/blackboard \
            --cov=lambda/broadcast \
            --cov=lambda/JobClean \
            --cov=lambda/JobDelete \
            --cov=lambda/JobPredict \
            --cov=lambda/JobRescue \
            --cov=lambda/ModelIngest \
            --cov=lambda/s3_trigger \
            --cov-fail-under 30 \

  pytest:
    name: pytest
    runs-on: ubuntu-22.04

    steps:
      - name: set up python 3.13
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: checkout code
        uses: actions/checkout@v2

      - name: install requirements
        run: |
          pip install .[dev]
          pip install -r lambda/JobPredict/requirements.txt --upgrade-strategy only-if-needed

      - name: run pytest
        run: |
          # Match docker flag
          export JOBLIB_MULTIPROCESSING=0
          pytest -rP